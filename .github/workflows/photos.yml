# Télécharge des photos d'animaux depuis Wikimedia Commons (licences libres) et les ajoute au jeu.
# À lancer à la main : onglet Actions → « Photos des animaux » → Run workflow. Par défaut, les races de chien
# beagle et greyhound et les cartes Habitat dont la photo était une carte ou une vue satellite
# (recherches dans scripts/photos/recherche.json). Le site est ensuite remis en ligne avec les nouvelles photos.
name: Photos des animaux

on:
  workflow_dispatch:
    inputs:
      seulement:
        description: Identifiants des animaux, séparés par des virgules
        default: beagle,greyhound,habitat-antarctique,habitat-borneo,habitat-galapagos,habitat-gobi,habitat-grande-barriere,habitat-himalaya,habitat-madagascar,habitat-mariannes,habitat-okavango,habitat-patagonie,habitat-sahara,habitat-taiga,habitat-serengeti,habitat-monteverde

permissions:
  contents: write
  actions: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node scripts/photos/telecharger-photos.mjs telecharger --seulement "${{ inputs.seulement }}"
      - run: node scripts/photos/telecharger-photos.mjs finaliser
      - name: Enregistrer les photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/photos src/data/photos.json
          if git diff --cached --quiet; then echo "Aucune nouvelle photo"; exit 0; fi
          git commit -m "Photos des animaux et des habitats"
          git push
          # un envoi fait par ce robot ne relance pas la mise en ligne tout seul : on la demande
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
